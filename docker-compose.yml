name: honeyforge

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honeyforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-honeyforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honeyforge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - control_net

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-honeyforge}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-honeyforge}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-honeyforge}:${POSTGRES_PASSWORD:-change-me}@db:5432/honeyforge_test
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:-change-me-too}
      AGENT_INGEST_SECRET: ${AGENT_INGEST_SECRET:-change-me-ingest-secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-at-least-32-bytes-long}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
      FLEET_OFFLINE_AFTER_S: ${FLEET_OFFLINE_AFTER_S:-45}
      # Consumed by `python -m app.seed` (operator + optional analyst provisioning).
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-admin}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-change-me-operator-password}
      ANALYST_USERNAME: ${ANALYST_USERNAME:-analyst}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-}
      # Consumed by `python -m app.seed` (per-agent tokens for the decoys).
      AGENT_TOKEN: ${AGENT_TOKEN:-change-me-agent-token}
      MEDIUM_AGENT_TOKEN: ${MEDIUM_AGENT_TOKEN:-change-me-medium-agent-token}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "${HOST_BIND:-127.0.0.1}:8000:8000"
    networks:
      - control_net
      - telemetry_net
      - frontend_net

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${HOST_BIND:-127.0.0.1}:5173:5173"
    networks:
      - frontend_net

  agent:
    build: ./agent
    environment:
      HF_CENTER_URL: http://backend:8000
      HF_AGENT_TOKEN: ${AGENT_TOKEN:-change-me-agent-token}
      HF_AGENT_INGEST_SECRET: ${AGENT_INGEST_SECRET:-change-me-ingest-secret}
      HF_INGEST_PORT: "9000"
      HF_SPOOL_PATH: /data/agent-spool.jsonl
    volumes:
      - agent_spool:/data
    depends_on:
      backend:
        condition: service_started
    # No host-exposed ports: only reachable on telemetry_net + agent_low_net.
    networks:
      - telemetry_net
      - agent_low_net

  agent-medium:
    build: ./agent
    environment:
      HF_CENTER_URL: http://backend:8000
      HF_AGENT_TOKEN: ${MEDIUM_AGENT_TOKEN:-change-me-medium-agent-token}
      HF_AGENT_INGEST_SECRET: ${AGENT_INGEST_SECRET:-change-me-ingest-secret}
      HF_INGEST_PORT: "9000"
      HF_SPOOL_PATH: /data/agent-medium-spool.jsonl
    volumes:
      - agent_medium_spool:/data
    depends_on:
      backend:
        condition: service_started
    # No host-exposed ports: only reachable on telemetry_net + agent_medium_net.
    networks:
      - telemetry_net
      - agent_medium_net

  low:
    build: ./honeypots/low
    environment:
      HF_AGENT_URL: http://agent:9000
      HF_AGENT_INGEST_SECRET: ${AGENT_INGEST_SECRET:-change-me-ingest-secret}
    depends_on:
      agent:
        condition: service_started
    # Never on telemetry_net or the host; its agent sits one hop away.
    networks:
      - agent_low_net
      - decoy_net

  medium:
    build: ./honeypots/medium
    environment:
      HF_AGENT_URL: http://agent-medium:9000
      HF_AGENT_INGEST_SECRET: ${AGENT_INGEST_SECRET:-change-me-ingest-secret}
    depends_on:
      agent-medium:
        condition: service_started
    # Never on telemetry_net or the host; its agent sits one hop away.
    networks:
      - agent_medium_net
      - decoy_net

  test-client:
    build: ./test-client
    # Controlled traffic source for the demo, isolated on decoy_net only.
    networks:
      - decoy_net

networks:
  frontend_net: {} # host-facing (default bridge semantics)
  control_net:
    internal: true
  telemetry_net:
    internal: true
  agent_low_net:
    internal: true
  agent_medium_net:
    internal: true
  decoy_net:
    internal: true

volumes:
  pgdata:
  agent_spool:
  agent_medium_spool: